name: kvitto-payments-api

services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: "sqlite:////data/payments.db"
      WEBHOOK_SECRET: "${WEBHOOK_SECRET:?Set WEBHOOK_SECRET in .env}"
    volumes:
      - payments_data:/data
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  payments_data:
